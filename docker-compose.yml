version: "3.9"

services:
  db:
    image: pgvector/pgvector:pg16
    container_name: ci_postgres
    environment:
      POSTGRES_DB: client_intelligence
      POSTGRES_USER: ci_user
      POSTGRES_PASSWORD: ci_password
    ports:
      - "5432:5432"
    volumes:
      - pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ci_user -d client_intelligence"]
      interval: 10s
      timeout: 5s
      retries: 5

volumes:
  pgdata:
