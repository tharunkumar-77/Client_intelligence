{% extends "base.html" %}
{% block title %}404 — Not Found · Client Intelligence{% endblock %}
{% block content %}
<div style="display:flex;flex-direction:column;align-items:center;justify-content:center;min-height:80vh;text-align:center;padding:40px;">
  <div style="font-size:80px;font-weight:800;background:linear-gradient(135deg,var(--accent),var(--accent-2));-webkit-background-clip:text;-webkit-text-fill-color:transparent;background-clip:text;letter-spacing:-4px;line-height:1;">404</div>
  <h2 style="font-size:22px;font-weight:700;margin:16px 0 8px;">Page not found</h2>
  <p style="color:var(--text-muted);font-size:14px;max-width:360px;line-height:1.6;">The page you're looking for doesn't exist or has been moved.</p>
  <div style="display:flex;gap:12px;margin-top:28px;">
    <a href="/dashboard" class="btn btn-primary">← Back to Dashboard</a>
    <a href="javascript:history.back()" class="btn btn-ghost">Go Back</a>
  </div>
</div>
{% endblock %}
