{% extends "base.html" %}
{% block title %}500 — Server Error · Client Intelligence{% endblock %}
{% block content %}
<div style="display:flex;flex-direction:column;align-items:center;justify-content:center;min-height:80vh;text-align:center;padding:40px;">
  <div style="font-size:80px;font-weight:800;background:linear-gradient(135deg,var(--danger),var(--warn));-webkit-background-clip:text;-webkit-text-fill-color:transparent;background-clip:text;letter-spacing:-4px;line-height:1;">500</div>
  <h2 style="font-size:22px;font-weight:700;margin:16px 0 8px;">Internal server error</h2>
  <p style="color:var(--text-muted);font-size:14px;max-width:360px;line-height:1.6;">Something went wrong on our end. If this persists, check the application logs.</p>
  <div style="display:flex;gap:12px;margin-top:28px;">
    <a href="/dashboard" class="btn btn-primary">← Back to Dashboard</a>
    <button onclick="location.reload()" class="btn btn-ghost">Retry</button>
  </div>
</div>
{% endblock %}
